<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rueda de rifa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2B3FE0; --ink:#14143A; --paper:#FFFFFF; --sun:#FFD23F; --coral:#FF6B8B; --mint:#3DDCB0;
  --font:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--paper);font-family:var(--font);min-height:100vh;padding:24px 16px 40px}
h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;margin:0 0 4px;letter-spacing:-.02em;text-align:center}
.sub{text-align:center;margin:0 0 28px;opacity:.85}
main{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
.stage{position:relative;max-width:520px;width:100%;margin:0 auto}
canvas{width:100%;height:auto;aspect-ratio:1;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:18px solid transparent;border-right:18px solid transparent;border-top:38px solid var(--sun);
  filter:drop-shadow(0 3px 0 var(--ink));z-index:2}
.spin{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:22%;aspect-ratio:1;border-radius:50%;
  border:5px solid var(--ink);background:var(--sun);color:var(--ink);font:800 clamp(.8rem,2.6vw,1.2rem)/1 var(--font);cursor:pointer}
.spin:hover:not(:disabled){background:#fff}
.spin:disabled{cursor:not-allowed;opacity:.7}
.panel{background:var(--paper);color:var(--ink);border-radius:14px;padding:20px;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.panel h2{margin:0 0 4px;font-size:1.3rem}
.hint{margin:0 0 12px;font-size:.9rem;opacity:.7}
textarea{width:100%;font:500 1rem var(--font);color:var(--ink);padding:10px;border:2px solid var(--ink);border-radius:8px;resize:vertical;min-height:70px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
button.btn{font:700 .95rem var(--font);padding:9px 14px;border-radius:8px;border:2px solid var(--ink);background:var(--mint);color:var(--ink);cursor:pointer}
button.btn.alt{background:var(--paper)}
button.btn:hover{background:var(--sun)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
ul{list-style:none;margin:16px 0 0;padding:0;max-height:260px;overflow:auto}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px dashed #b9b9d0}
li span{overflow-wrap:anywhere}
li button{border:0;background:none;color:var(--coral);font:700 1.2rem var(--font);cursor:pointer;line-height:1;padding:2px 8px}
.count{font-weight:700;margin-top:14px}
.empty{opacity:.7;padding:8px 0}
dialog{border:4px solid var(--ink);border-radius:16px;padding:28px 32px;text-align:center;background:var(--sun);color:var(--ink);box-shadow:8px 8px 0 var(--ink);max-width:90vw}
dialog::backdrop{background:rgba(20,20,58,.7)}
dialog p{margin:0 0 6px;font-weight:600}
dialog .name{font-size:clamp(2rem,8vw,3.5rem);font-weight:800;line-height:1.1;overflow-wrap:anywhere;margin-bottom:18px}
dialog .row{justify-content:center}
</style>
</head>
<body>
<h1>Rueda de rifa</h1>
<p class="sub">Escribe los nombres, gira la rueda y descubre al ganador.</p>

<main>
  <section class="stage" aria-label="Rueda">
    <div class="pointer"></div>
    <canvas id="wheel" width="800" height="800" role="img" aria-label="Rueda con los nombres de los participantes"></canvas>
    <button class="spin" id="spin">GIRAR</button>
  </section>

  <section class="panel">
    <h2>Participantes</h2>
    <p class="hint">Escribe un nombre por línea, o varios separados por comas.</p>
    <textarea id="input" placeholder="Ana&#10;Luis&#10;María"></textarea>
    <div class="row">
      <button class="btn" id="add">Agregar</button>
      <button class="btn alt" id="shuffle">Mezclar</button>
      <button class="btn alt" id="clear">Borrar todos</button>
    </div>
    <div class="count" id="count"></div>
    <ul id="list"></ul>
  </section>
</main>

<dialog id="result">
  <p>¡El ganador es!</p>
  <div class="name" id="winner"></div>
  <div class="row">
    <button class="btn" id="removeWinner">Quitar de la rueda</button>
    <button class="btn alt" id="close">Cerrar</button>
  </div>
</dialog>

<script>
(function(){
  var COLORS = ['#FFD23F','#FF6B8B','#3DDCB0','#FFFFFF','#7CC6FF'];
  var INK = '#14143A';
  var names = [];
  var rot = 0;
  var spinning = false;
  var lastWinner = -1;

  var canvas = document.getElementById('wheel');
  var ctx = canvas.getContext('2d');
  var input = document.getElementById('input');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var spinBtn = document.getElementById('spin');
  var dialog = document.getElementById('result');
  var winnerEl = document.getElementById('winner');

  try {
    var saved = JSON.parse(localStorage.getItem('rifa-nombres') || '[]');
    if (Array.isArray(saved)) names = saved.filter(function(n){ return typeof n === 'string'; });
  } catch (e) {}
  if (!names.length) names = ['Ana', 'Luis', 'María', 'Carlos'];

  function save(){
    try { localStorage.setItem('rifa-nombres', JSON.stringify(names)); } catch (e) {}
  }

  function colorFor(i, n){
    if (n > 1 && i === n - 1 && i % COLORS.length === 0) return '#C8A2FF';
    return COLORS[i % COLORS.length];
  }

  function draw(){
    var W = canvas.width, c = W / 2, r = c - 14;
    ctx.clearRect(0, 0, W, W);
    ctx.save();
    ctx.translate(c, c);

    // borde exterior
    ctx.beginPath(); ctx.arc(0, 0, r + 10, 0, Math.PI * 2);
    ctx.fillStyle = INK; ctx.fill();

    var n = names.length;
    if (!n) {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = '#E8E8F5'; ctx.fill();
      ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '700 40px Bricolage Grotesque, system-ui, sans-serif';
      ctx.fillText('Agrega nombres', 0, 0);
      ctx.restore();
      return;
    }

    var arc = Math.PI * 2 / n;
    for (var i = 0; i < n; i++) {
      var a0 = rot + i * arc, a1 = a0 + arc;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, a0, a1); ctx.closePath();
      ctx.fillStyle = colorFor(i, n); ctx.fill();
      if (n > 1) { ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke(); }

      ctx.save();
      ctx.rotate(a0 + arc / 2);
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillStyle = INK;
      var size = Math.max(16, Math.min(44, r * arc * 0.42));
      ctx.font = '700 ' + size + 'px Bricolage Grotesque, system-ui, sans-serif';
      var label = names[i], maxW = r * 0.62;
      while (label.length > 1 && ctx.measureText(label).width > maxW) label = label.slice(0, -1);
      if (label !== names[i]) label = label.trim() + '…';
      ctx.fillText(label, r - 24, 0);
      ctx.restore();
    }
    ctx.restore();
  }

  function winnerIndex(){
    var n = names.length, arc = Math.PI * 2 / n;
    var a = (-Math.PI / 2 - rot) % (Math.PI * 2);
    if (a < 0) a += Math.PI * 2;
    return Math.floor(a / arc) % n;
  }

  function render(){
    list.innerHTML = '';
    if (!names.length) {
      var e = document.createElement('li'); e.className = 'empty'; e.textContent = 'Todavía no hay nombres.';
      list.appendChild(e);
    }
    names.forEach(function(name, i){
      var li = document.createElement('li');
      var s = document.createElement('span'); s.textContent = name;
      var b = document.createElement('button');
      b.textContent = '×'; b.setAttribute('aria-label', 'Quitar a ' + name);
      b.onclick = function(){ if (spinning) return; names.splice(i, 1); save(); render(); };
      li.appendChild(s); li.appendChild(b); list.appendChild(li);
    });
    count.textContent = names.length + (names.length === 1 ? ' participante' : ' participantes');
    spinBtn.disabled = spinning || names.length < 2;
    draw();
  }

  function addNames(){
    var parts = input.value.split(/[\n,]+/).map(function(s){ return s.trim(); }).filter(Boolean);
    if (!parts.length) return;
    names = names.concat(parts);
    input.value = '';
    save(); render();
  }

  document.getElementById('add').onclick = addNames;
  input.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); addNames(); }
  });
  document.getElementById('shuffle').onclick = function(){
    if (spinning) return;
    for (var i = names.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = names[i]; names[i] = names[j]; names[j] = t;
    }
    save(); render();
  };
  document.getElementById('clear').onclick = function(){
    if (spinning || !names.length) return;
    if (confirm('¿Borrar todos los nombres?')) { names = []; save(); render(); }
  };

  function ease(t){ return 1 - Math.pow(1 - t, 4); }

  spinBtn.onclick = function(){
    if (spinning || names.length < 2) return;
    spinning = true; spinBtn.disabled = true;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var duration = reduce ? 1500 : 5500;
    var start = rot;
    var total = (reduce ? 2 : 6 + Math.random() * 4) * Math.PI * 2 + Math.random() * Math.PI * 2;
    var t0 = null;
    function frame(ts){
      if (t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / duration);
      rot = start + total * ease(p);
      draw();
      if (p < 1) requestAnimationFrame(frame);
      else {
        spinning = false;
        lastWinner = winnerIndex();
        winnerEl.textContent = names[lastWinner];
        spinBtn.disabled = false;
        dialog.showModal();
      }
    }
    requestAnimationFrame(frame);
  };

  document.getElementById('close').onclick = function(){ dialog.close(); };
  document.getElementById('removeWinner').onclick = function(){
    if (lastWinner >= 0) { names.splice(lastWinner, 1); lastWinner = -1; save(); render(); }
    dialog.close();
  };

  render();
})();
</script>
</body>
</html>
