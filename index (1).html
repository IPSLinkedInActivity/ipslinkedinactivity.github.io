<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iron Peak Solutions · Prize Draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#031d40; --deep:#021430; --paper:#FFFFFF; --teal:#22B8C8; --ice:#CFEFF3; --li:#0A66C2;
  --font:'Barlow Semi Condensed','Arial Narrow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--paper);font-family:var(--font);min-height:100vh;padding:20px 16px 44px}
header{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{width:min(380px,62vw);height:auto;display:block}
.li{display:flex;align-items:center;gap:10px;color:var(--paper);text-decoration:none;font-weight:600}
.li svg{width:clamp(40px,8vw,56px);height:auto;display:block}
.message{max-width:780px;margin:10px auto 34px;text-align:center;font-size:clamp(1.3rem,3.6vw,2rem);font-weight:600;line-height:1.25;
  padding:18px 22px;border-top:3px solid var(--teal);border-bottom:3px solid var(--teal)}
.message strong{font-weight:700}
.prize{max-width:780px;margin:-12px auto 30px;text-align:center;background:var(--teal);color:var(--deep);border-radius:12px;padding:12px 20px}
.prize small{display:block;font-size:1rem;font-weight:600;opacity:.8}
.prize span{display:block;font-size:clamp(1.6rem,5vw,2.6rem);font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.field{width:100%;font:500 1rem var(--font);color:var(--deep);padding:10px;border:2px solid var(--deep);border-radius:8px;margin-bottom:16px}
label.lbl{display:block;font-weight:700;margin-bottom:6px}
dialog .wp{font-size:1.1rem;margin:-8px 0 18px}
main{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
.stage{position:relative;max-width:520px;width:100%;margin:0 auto}
canvas{width:100%;height:auto;aspect-ratio:1;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:18px solid transparent;border-right:18px solid transparent;border-top:38px solid var(--teal);
  filter:drop-shadow(0 3px 0 var(--deep));z-index:2}
.spin{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:22%;aspect-ratio:1;border-radius:50%;
  border:5px solid var(--deep);background:var(--teal);color:var(--deep);font:700 clamp(.85rem,2.8vw,1.3rem)/1 var(--font);cursor:pointer}
.spin:hover:not(:disabled){background:#fff}
.spin:disabled{cursor:not-allowed;opacity:.7}
.panel{background:var(--paper);color:var(--deep);border-radius:12px;padding:20px;border:3px solid var(--teal)}
.panel h2{margin:0 0 4px;font-size:1.4rem}
.hint{margin:0 0 12px;font-size:.95rem;opacity:.7}
textarea{width:100%;font:500 1rem var(--font);color:var(--deep);padding:10px;border:2px solid var(--deep);border-radius:8px;resize:vertical;min-height:70px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
button.btn{font:700 .95rem var(--font);padding:9px 14px;border-radius:8px;border:2px solid var(--deep);background:var(--teal);color:var(--deep);cursor:pointer}
button.btn.alt{background:var(--paper)}
button.btn:hover{background:var(--ice)}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #FFD23F;outline-offset:2px}
ul{list-style:none;margin:16px 0 0;padding:0;max-height:260px;overflow:auto}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px dashed #b4c3d6}
li span{overflow-wrap:anywhere}
li button{border:0;background:none;color:#d6334f;font:700 1.2rem var(--font);cursor:pointer;line-height:1;padding:2px 8px}
.count{font-weight:700;margin-top:14px}
.empty{opacity:.7;padding:8px 0}
dialog{border:4px solid var(--teal);border-radius:14px;padding:28px 32px;text-align:center;background:var(--paper);color:var(--deep);max-width:90vw}
dialog::backdrop{background:rgba(2,20,48,.8)}
dialog p{margin:0 0 6px;font-weight:600;font-size:1.2rem}
dialog .name{font-size:clamp(2.4rem,9vw,4rem);font-weight:700;line-height:1.1;overflow-wrap:anywhere;margin-bottom:18px;color:var(--li)}
dialog .row{justify-content:center}
</style>
</head>

(function(){
  var DEFAULTS = ['Evee','Sebastian','Tito','Santiago','Paula','Samuel','Francis','Oscar'];
  var SEGMENTS = [['#FFFFFF','#031d40'],['#22B8C8','#031d40'],['#2F5FC4','#FFFFFF'],['#CFEFF3','#031d40']];
  var EXTRA = ['#7AA2F0','#031d40'];
  var INK = '#021430';
  var FONT = 'Barlow Semi Condensed, Arial Narrow, system-ui, sans-serif';
  var KEY = 'ironpeak-prize-draw';
  var names = DEFAULTS.slice();
  var rot = 0, spinning = false, lastWinner = -1;

  var canvas = document.getElementById('wheel');
  var ctx = canvas.getContext('2d');
  var input = document.getElementById('input');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var spinBtn = document.getElementById('spin');
  var dialog = document.getElementById('result');
  var winnerEl = document.getElementById('winner');

  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (Array.isArray(saved)) names = saved.filter(function(n){ return typeof n === 'string'; });
  } catch (e) {}

  var prize = '';
  try { prize = localStorage.getItem(KEY + '-prize') || ''; } catch (e) {}
  var prizeInput = document.getElementById('prize');
  var prizeBox = document.getElementById('prizeBox');
  var prizeShow = document.getElementById('prizeShow');
  var winPrize = document.getElementById('winPrize');
  function showPrize(){
    prizeInput.value = prize;
    prizeShow.textContent = prize;
    prizeBox.hidden = !prize;
  }
  prizeInput.addEventListener('input', function(){
    prize = prizeInput.value.trim();
    prizeShow.textContent = prize;
    prizeBox.hidden = !prize;
    try { localStorage.setItem(KEY + '-prize', prize); } catch (e) {}
  });
  showPrize();

  function save(){ try { localStorage.setItem(KEY, JSON.stringify(names)); } catch (e) {} }

  function segFor(i, n){
    if (n > 1 && i === n - 1 && i % SEGMENTS.length === 0) return EXTRA;
    return SEGMENTS[i % SEGMENTS.length];
  }

  function draw(){
    var W = canvas.width, c = W / 2, r = c - 14;
    ctx.clearRect(0, 0, W, W);
    ctx.save(); ctx.translate(c, c);
    ctx.beginPath(); ctx.arc(0, 0, r + 10, 0, Math.PI * 2);
    ctx.fillStyle = '#22B8C8'; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, r + 4, 0, Math.PI * 2);
    ctx.fillStyle = INK; ctx.fill();

    var n = names.length;
    if (!n) {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = '#DCE6F2'; ctx.fill();
      ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '700 44px ' + FONT;
      ctx.fillText('Add names', 0, 0);
      ctx.restore(); return;
    }

    var arc = Math.PI * 2 / n;
    for (var i = 0; i < n; i++) {
      var a0 = rot + i * arc, a1 = a0 + arc, seg = segFor(i, n);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, a0, a1); ctx.closePath();
      ctx.fillStyle = seg[0]; ctx.fill();
      if (n > 1) { ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke(); }

      ctx.save();
      ctx.rotate(a0 + arc / 2);
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillStyle = seg[1];
      var size = Math.max(18, Math.min(50, r * arc * 0.45));
      ctx.font = '700 ' + size + 'px ' + FONT;
      var label = names[i], maxW = r * 0.62;
      while (label.length > 1 && ctx.measureText(label).width > maxW) label = label.slice(0, -1);
      if (label !== names[i]) label = label.trim() + '…';
      ctx.fillText(label, r - 24, 0);
      ctx.restore();
    }
    ctx.restore();
  }

  function winnerIndex(){
    var n = names.length, arc = Math.PI * 2 / n;
    var a = (-Math.PI / 2 - rot) % (Math.PI * 2);
    if (a < 0) a += Math.PI * 2;
    return Math.floor(a / arc) % n;
  }

  function render(){
    list.innerHTML = '';
    if (!names.length) {
      var e = document.createElement('li'); e.className = 'empty'; e.textContent = 'No names yet.';
      list.appendChild(e);
    }
    names.forEach(function(name, i){
      var li = document.createElement('li');
      var s = document.createElement('span'); s.textContent = name;
      var b = document.createElement('button');
      b.textContent = '×'; b.setAttribute('aria-label', 'Remove ' + name);
      b.onclick = function(){ if (spinning) return; names.splice(i, 1); save(); render(); };
      li.appendChild(s); li.appendChild(b); list.appendChild(li);
    });
    count.textContent = names.length + (names.length === 1 ? ' participant' : ' participants');
    spinBtn.disabled = spinning || names.length < 2;
    draw();
  }

  function addNames(){
    var parts = input.value.split(/[\n,]+/).map(function(s){ return s.trim(); }).filter(Boolean);
    if (!parts.length) return;
    names = names.concat(parts);
    input.value = '';
    save(); render();
  }

  document.getElementById('add').onclick = addNames;
  input.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); addNames(); }
  });
  document.getElementById('shuffle').onclick = function(){
    if (spinning) return;
    for (var i = names.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = names[i]; names[i] = names[j]; names[j] = t;
    }
    save(); render();
  };
  document.getElementById('reset').onclick = function(){
    if (spinning) return;
    if (confirm('Restore the original list of participants?')) { names = DEFAULTS.slice(); save(); render(); }
  };

  function ease(t){ return 1 - Math.pow(1 - t, 4); }

  spinBtn.onclick = function(){
    if (spinning || names.length < 2) return;
    spinning = true; spinBtn.disabled = true;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var duration = reduce ? 1500 : 5500;
    var start = rot;
    var total = (reduce ? 2 : 6 + Math.random() * 4) * Math.PI * 2 + Math.random() * Math.PI * 2;
    var t0 = null;
    function frame(ts){
      if (t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / duration);
      rot = start + total * ease(p);
      draw();
      if (p < 1) requestAnimationFrame(frame);
      else {
        spinning = false;
        lastWinner = winnerIndex();
        winnerEl.textContent = names[lastWinner];
        winPrize.textContent = prize ? 'Wins: ' + prize : '';
        winPrize.hidden = !prize;
        spinBtn.disabled = false;
        dialog.showModal();
      }
    }
    requestAnimationFrame(frame);
  };

  document.getElementById('close').onclick = function(){ dialog.close(); };
  document.getElementById('removeWinner').onclick = function(){
    if (lastWinner >= 0) { names.splice(lastWinner, 1); lastWinner = -1; save(); render(); }
    dialog.close();
  };

  render();
})();
</script>
</body>
</html>
